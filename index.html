<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeeStreetLab | Official Store & Drops</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            orange: '#FF5722',
                            dark: '#0B0F19',
                            card: '#151C2C',
                            border: '#232D42'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glow-effect {
            box-shadow: 0 4px 20px -2px rgba(255, 87, 34, 0.35);
        }
        .pulse-subtle {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0%, 100% { border-color: rgba(255, 87, 34, 0.4); }
            50% { border-color: rgba(255, 87, 34, 0.8); }
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-200 min-h-screen font-sans antialiased selection:bg-brand-orange selection:text-white">

    <main class="max-w-md mx-auto px-4 py-8 flex flex-col items-center">

        <!-- Header / Brand Identity -->
        <header class="text-center flex flex-col items-center w-full mb-6">
            <div class="relative mb-4">
                <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-brand-orange via-orange-500 to-amber-500 p-1 glow-effect">
                    <div class="w-full h-full rounded-full bg-[#0b0f19] flex items-center justify-center border-2 border-slate-800">
                        <i class="fa-solid fa-shirt text-3xl text-brand-orange"></i>
                    </div>
                </div>
                <span class="absolute bottom-1 right-1 bg-emerald-500 w-4 h-4 rounded-full border-2 border-[#0b0f19]" title="Store Open"></span>
            </div>

            <h1 class="font-display font-bold text-2xl tracking-tight text-white mb-1">TeeStreetLab</h1>
            <p class="text-xs font-semibold uppercase tracking-widest text-brand-orange mb-2">Streetwear & Graphic Apparel</p>
            <p class="text-xs text-slate-400 max-w-xs leading-relaxed">
                Premium urban apparel & unique graphic drops. Worldwide delivery printed on demand by TeePublic.
            </p>
        </header>

        <!-- Primary CTA: Main Store Link -->
        <section class="w-full mb-6">
            <a href="https://www.teepublic.com" target="_blank" rel="noopener noreferrer"
               class="flex items-center justify-center gap-3 w-full bg-gradient-to-r from-brand-orange to-orange-600 hover:from-orange-600 hover:to-brand-orange text-white font-semibold py-3.5 px-6 rounded-2xl shadow-lg glow-effect transition-all duration-300 transform active:scale-95">
                <i class="fa-solid fa-bag-shopping text-lg"></i>
                <span>Explore Full Store on TeePublic</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-75"></i>
            </a>
        </section>

        <!-- Product Grid Header -->
        <section class="w-full mb-8">
            <div class="flex items-center justify-between mb-3 px-1">
                <h2 class="font-display font-semibold text-xs uppercase tracking-wider text-slate-400">Featured Drops</h2>
                <span class="text-[10px] bg-brand-orange/10 text-brand-orange font-semibold px-2 py-0.5 rounded-full border border-brand-orange/30">
                    <i class="fa-solid fa-tag text-[9px] mr-1"></i>Deals Applied At Checkout
                </span>
            </div>

            <!-- Dynamic Products Grid -->
            <div id="products-grid" class="grid grid-cols-2 gap-3.5">
                <!-- Skeleton / Loading State -->
                <div id="loading-state" class="col-span-2 text-center py-12">
                    <i class="fa-solid fa-circle-notch fa-spin text-brand-orange text-2xl mb-2"></i>
                    <p class="text-xs text-slate-500">Loading catalog...</p>
                </div>
            </div>
        </section>

        <!-- Social Channels -->
        <section class="w-full flex flex-col items-center gap-3 pt-2 pb-6 border-t border-slate-800/80">
            <span class="text-[11px] uppercase tracking-wider text-slate-500 font-medium">Follow The Lab</span>
            <div class="flex items-center gap-4">
                <!-- Pinterest -->
                <a href="https://pinterest.com" target="_blank" rel="noopener noreferrer" 
                   aria-label="Pinterest"
                   class="w-11 h-11 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-red-500 hover:border-red-500/50 transition-all transform hover:-translate-y-1">
                    <i class="fa-brands fa-pinterest-p text-lg"></i>
                </a>
                <!-- Instagram -->
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" 
                   aria-label="Instagram"
                   class="w-11 h-11 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-pink-500 hover:border-pink-500/50 transition-all transform hover:-translate-y-1">
                    <i class="fa-brands fa-instagram text-lg"></i>
                </a>
                <!-- TikTok -->
                <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" 
                   aria-label="TikTok"
                   class="w-11 h-11 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-cyan-400 hover:border-cyan-400/50 transition-all transform hover:-translate-y-1">
                    <i class="fa-brands fa-tiktok text-lg"></i>
                </a>
            </div>
        </section>

        <!-- Minimal Footer -->
        <footer class="text-center text-xs text-slate-500">
            <p>© 2026 TeeStreetLab. Powered by TeePublic.</p>
        </footer>

    </main>

    <!-- JavaScript Engine: Fetching products.json -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('products-grid');
            
            // إضافة timestamp لتجاوز الكاش وضمان سحب أحدث نسخة فوراً عند أي تعديل
            fetch('./products.json?v=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load products.json');
                    }
                    return response.json();
                })
                .then(products => {
                    grid.innerHTML = ''; // مسح مؤشر التحميل

                    if (!products || products.length === 0) {
                        grid.innerHTML = '<p class="col-span-2 text-center text-xs text-slate-500 py-6">No products found.</p>';
                        return;
                    }

                    products.forEach(item => {
                        // معالجة عرض السعر بمرونة
                        const priceDisplay = item.price ? item.price : 'Check Price';
                        const categoryDisplay = item.category ? item.category : 'Tee';

                        const cardHTML = `
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
                               class="group bg-slate-900/90 border border-slate-800/90 rounded-2xl overflow-hidden hover:border-brand-orange/60 transition-all duration-300 flex flex-col">
                                <div class="aspect-square bg-slate-800/40 relative overflow-hidden flex items-center justify-center">
                                    <img src="${item.image}" 
                                         alt="${item.title}" 
                                         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                         loading="lazy"
                                         onerror="this.src='https://via.placeholder.com/400x400?text=TeeStreetLab'">
                                    <span class="absolute top-2 right-2 bg-black/65 backdrop-blur-md text-slate-200 text-[10px] font-bold px-2 py-0.5 rounded-md border border-white/10">
                                        ${categoryDisplay}
                                    </span>
                                </div>
                                <div class="p-3 flex flex-col flex-grow justify-between gap-2">
                                    <h3 class="font-medium text-xs text-white line-clamp-1 group-hover:text-brand-orange transition-colors">
                                        ${item.title}
                                    </h3>
                                    <div class="flex items-center justify-between pt-1 border-t border-slate-800/60">
                                        <span class="text-xs font-semibold text-slate-300">${priceDisplay}</span>
                                        <span class="text-[11px] font-semibold text-brand-orange group-hover:translate-x-0.5 transition-transform flex items-center gap-1">
                                            Shop <i class="fa-solid fa-chevron-right text-[8px]"></i>
                                        </span>
                                    </div>
                                </div>
                            </a>
                        `;
                        grid.innerHTML += cardHTML;
                    });
                })
                .catch(err => {
                    console.error(err);
                    grid.innerHTML = '<p class="col-span-2 text-center text-xs text-red-400 py-6">Could not load products. Please ensure products.json exists.</p>';
                });
        });
    </script>
</body>
</html>
